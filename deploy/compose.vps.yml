# Superseded by the repository-root docker-compose.yml.
#
# The VPS now runs `docker compose up -d --build` at the checkout root after a
# `git pull`: the compose file, the registry and the Dockerfile all come from
# git, so there is no hand-maintained copy to drift. The root file uses
# `build: .`; this one assumed a `./src` sub-checkout and a registry inside
# ./projects. Kept for reference only.
#
#   /opt/compewtertutor/tidetable/
#     docker-compose.yml   <- the real one, from the repo root
#     .env                 TK_API_TOKEN=...   (chmod 600)
#     projects/<slug>/todo.json
#
# The API route deliberately has no forwardAuth: machine agents authenticate
# with a bearer token at the app layer. The hub refuses every request without
# one.
services:
  core:
    build: ./src
    image: tidetable-core:latest
    container_name: tidetable-core
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./projects:/app/projects
    expose:
      - "8471"
    networks:
      - proxy-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-public"
      - "traefik.http.routers.tidetable.rule=Host(`tidetable.compewtertutor.com`)"
      - "traefik.http.routers.tidetable.entrypoints=websecure"
      - "traefik.http.routers.tidetable.middlewares=security-headers@file"
      - "traefik.http.routers.tidetable.tls=true"
      - "traefik.http.routers.tidetable.tls.certresolver=cloudflare-ct"
      - "traefik.http.services.tidetable.loadbalancer.server.port=8471"

networks:
  proxy-public:
    external: true
