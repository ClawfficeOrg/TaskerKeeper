name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # A plain (non-editable) install: this is what used to break, because the
      # schema lived outside the package.
      - run: pip install .
      - run: python -m unittest discover -s tests -v

      - name: Validate examples
        shell: bash
        run: |
          for f in examples/*.json; do
            taskerkeeper validate "$f"
          done

  ralph-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install .
      - name: ralph-json.sh forwards to the CLI
        run: |
          chmod +x ralph/ralph-json.sh
          ./ralph/ralph-json.sh validate examples/simple-project.json
          ./ralph/ralph-json.sh ready examples/zoidmatter-v7-example.json --json
