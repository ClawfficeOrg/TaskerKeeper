[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tidetable"
version = "0.9.0"
description = "Structured task management for autonomous agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["todo", "tasks", "agents", "json", "ralph"]
dependencies = [
    "jsonschema>=4.0",
]

[project.scripts]
tidetable = "tidetable.cli:main"
tt = "tidetable.cli:main"
# Pre-0.9 name, kept so existing agents and scripts keep working.
taskerkeeper = "tidetable.cli:main"

[tool.setuptools]
packages = ["tidetable", "taskerkeeper"]

[tool.setuptools.package-data]
# The schema ships inside the package so a non-editable install can find it.
tidetable = ["schema/*.json"]
